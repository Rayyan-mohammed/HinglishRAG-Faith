[project]
name = "codeswitch-verify"
version = "0.1.0"
description = "Faithfulness-checked RAG for Hinglish government-scheme Q&A"
authors = [{ name = "Rayyan Mohammed" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "groq",
    "sentence-transformers",
    "faiss-cpu",
    "pandas",
    "numpy",
    "python-dotenv",
    "tqdm",
    "pypdf>=6.16.1",
    "streamlit>=1.61.1",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
